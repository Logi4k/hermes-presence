[project]
name = "hermes-presence"
version = "3.1.0"
description = "Cross-platform Discord Rich Presence for Hermes Agent — one-command install, all OSes supported"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Philips Akinola"}
]
keywords = ["hermes", "discord", "rich-presence", "ai-agent", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pypresence>=4.3.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
hermes-presence = "hermes_presence.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_presence*"]
