name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify cleanup-state --dry-run parses and runs
        run: |
          mkdir -p /tmp/hermes-smoke/state
          cat > /tmp/hermes-smoke/state/presence.json <<'JSON'
          {"version":3,"timestamp":"2026-05-09T10:00:00+00:00","activity":{"state":"idle"},"session":{}}
          JSON
          hermes-presence cleanup-state --dry-run --state-dir /tmp/hermes-smoke/state --max-age 1
      - name: Verify cleanup-profiles --dry-run is accepted by parser
        run: |
          python3 -c "
          import sys
          from hermes_presence import app
          sys.argv = ['hermes-presence', 'cleanup-profiles', '--dry-run', 'testprofile']
          try:
              app.main()
          except SystemExit as e:
              if e.code in (0, None):
                  print('OK: cleanup-profiles --dry-run accepted and exited cleanly')
              else:
                  print('OK: cleanup-profiles --dry-run parsed correctly (non-Windows exit is expected)')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ./scripts/ci-check.sh lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Type check
        run: ./scripts/ci-check.sh typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: ./scripts/ci-check.sh test
